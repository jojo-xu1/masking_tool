[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masking-tool"
version = "0.1.0"
description = "Local confidential string masking tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "PyMuPDF>=1.24",
  "lingua-language-detector>=2.0",
  "PySide6>=6.7",
  "click>=8.1",
  "spacy>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
masking-tool = "masking_tool.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
masking_tool_defaults = ["*.yml"]
